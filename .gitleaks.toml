# Reglas por defecto de gitleaks + reglas propias para fugas típicas de proyectos personales.
# Falsos positivos: añade su fingerprint a .gitleaksignore (gitleaks lo muestra en el informe).
[extend]
useDefault = true

[[rules]]
id = "dominio-propio-en-codigo"
description = "Correo del dominio propio (usa @example.com en tests y docs)"
regex = '''[A-Za-z0-9._%+-]+@(?:[a-z0-9-]+\.)*jualas\.es'''
keywords = ["jualas.es"]

[[rules]]
id = "ip-lan"
description = "IP de red local (no publicar la topología de casa)"
regex = '''\b(?:192\.168|10\.(?:\d{1,3})|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168", "10.", "172."]
  [[rules.allowlists]]
  regexes = ['''\b172\.17\.0\.1\b''']

[allowlist]
description = "Ficheros que no aportan secretos reales"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)(package-lock\.json|pubspec\.lock|poetry\.lock|uv\.lock)$''',
  '''(^|/)\.gitleaks\.toml$''',
]
