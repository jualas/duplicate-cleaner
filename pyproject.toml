[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-cleaner"
version = "0.3.0"
description = "Detector multiplataforma de archivos duplicados para Windows y Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jualas" }]
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
gui = [
    "PySide6>=6.12.0",
]
tui = [
    "textual>=8.2.8",
]

[project.scripts]
duplicate-cleaner = "duplicate_cleaner.cli:app"
duplicate-cleaner-gui = "duplicate_cleaner.gui.app:main"
duplicate-cleaner-tui = "duplicate_cleaner.tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
